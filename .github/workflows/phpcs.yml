name: PHP Code Sniffer

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  phpcs:
    name: Coding Standards (Uchū Docs)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, tokenizer
          tools: composer
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Verify PHP files
        run: |
          test -d src
          find src -type f -name "*.php" -print

      - name: Run PHPCBF
        run: vendor/bin/phpcbf src/ --extensions=php

      - name: Run PHPCS
        run: vendor/bin/phpcs src/ --extensions=php --warning-severity=0 --colors

      - name: Check formatting changes
        if: always()
        run: |
          echo "Checking whether PHPCBF modified files..."

          if ! git diff --quiet; then
            echo "::warning::PHPCBF modified files during this workflow."
            git diff --stat
            echo ""
            echo "Run vendor/bin/phpcbf src/ locally and commit the changes."
          else
            echo "No formatting changes required."
          fi
